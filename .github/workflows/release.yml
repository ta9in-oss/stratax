name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Tag matches Cargo version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare
        run: |
          cargo_v=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "stratax") | .version')
          core_pin=$(grep -oP 'stratax-core = \{[^}]*version = "\K[^"]+' Cargo.toml)
          echo "tag=${GITHUB_REF_NAME} cargo=${cargo_v} core-pin=${core_pin}"
          test "${GITHUB_REF_NAME}" = "v${cargo_v}" || { echo "::error::tag ${GITHUB_REF_NAME} != Cargo version ${cargo_v}"; exit 1; }
          test "${core_pin}" = "${cargo_v}" || { echo "::error::stratax-core pin ${core_pin} != ${cargo_v}"; exit 1; }

  cli:
    name: CLI · ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked -p stratax --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          name="stratax-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/stratax" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: stratax-*.tar.gz*

  desktop:
    name: Desktop · Linux (.deb, AppImage)
    needs: verify
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libxdo-dev libssl-dev file
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Build bundles
        working-directory: crates/stratax-desktop
        run: cargo tauri build
      - name: Collect
        run: |
          mkdir out
          cp target/release/bundle/deb/*.deb target/release/bundle/appimage/*.AppImage out/
          cd out && for f in *; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: out/*

  release:
    name: GitHub release
    needs: [cli, desktop]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          if gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber -R "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --title "Stratax $GITHUB_REF_NAME" --generate-notes
          fi
