<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stratax</title>
  <link rel="icon" href="icons/mark.svg" type="image/svg+xml">
  <link rel="preload" href="fonts/plex-sans-var.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/plex-mono-400.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Apply saved language and theme before first paint (no flash).
    (function () {
      var l = 'en', th = 'dark';
      try { l = localStorage.getItem('stratax.lang') || 'en'; th = localStorage.getItem('stratax.theme') || 'dark'; } catch (e) {}
      var r = document.documentElement;
      r.lang = l === 'ar' ? 'ar' : 'en'; r.dir = l === 'ar' ? 'rtl' : 'ltr';
      r.dataset.theme = th === 'light' ? 'light' : 'dark';
    })();
  </script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="rail" id="rail"></aside>
    <main class="stage">
      <header class="topbar" id="topbar"></header>
      <section class="view" id="view" tabindex="-1"></section>
    </main>
  </div>
  <div id="layer"></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
