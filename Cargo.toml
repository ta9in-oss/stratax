[workspace]
resolver = "2"
members = ["crates/stratax-core", "crates/stratax-cli", "crates/stratax-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Mohammed Essaid MEZERREG"]
repository = "https://github.com/ta9in-oss/stratax"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"
libc = "0.2"
sysinfo = "0.39"
ureq = { version = "2.12", features = ["json"] }
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
